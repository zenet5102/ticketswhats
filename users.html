<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-soft: #f8fbff;
      --line: #d9dee7;
      --text: #17202a;
      --muted: #657386;
      --accent: #2563eb;
      --accent-dark: #2563eb;
      --accent-soft: #eaf1ff;
      --accent-pale: #eaf1ff;
      --good: #11845b;
      --warn: #a16207;
      --bad: #bd2c2c;
      --soft-good: #e7f7ef;
      --soft-warn: #fff3d8;
      --soft-bad: #fde8e8;
      --soft-blue: #eaf1ff;
    }

    body.coordination-app {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-soft: #f8fbff;
      --line: #d9dee7;
      --text: #17202a;
      --muted: #657386;
      --accent: #2563eb;
      --accent-dark: #2563eb;
      --accent-soft: #eaf1ff;
      --accent-pale: #eaf1ff;
      --good: #11845b;
      --soft-good: #e7f7ef;
      --soft-blue: #eaf1ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
    }

    .content {
      width: min(1440px, calc(100% - 32px));
      margin: 0 auto;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      grid-template-rows: auto 1fr;
    }

    .app-header {
      grid-column: 1 / -1;
      border-bottom: 1px solid #1d4ed8;
      background: var(--accent-dark);
      color: #ffffff;
    }

    .app-header-inner {
      width: min(1180px, calc(100% - 32px));
      min-height: 68px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .sidebar {
      min-height: calc(100vh - 69px);
      position: sticky;
      top: 0;
      border-right: 1px solid var(--line);
      background: var(--panel-soft);
      padding: 16px 12px;
      align-self: start;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 4px;
      color: #dbeafe;
      font-size: 13px;
    }

    .actions,
    .primary-nav {
      gap: 8px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .primary-nav {
      display: grid;
    }

    .nav-group {
      display: grid;
      gap: 4px;
    }

    .nav-group summary {
      list-style: none;
    }

    .nav-group summary::-webkit-details-marker {
      display: none;
    }

    .nav-group .nav-link {
      width: 100%;
    }

    .nav-submenu {
      display: grid;
      gap: 4px;
      padding-left: 16px;
    }

    button,
    .button-link {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      padding: 0 12px;
      font: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
      text-decoration: none;
    }

    .nav-link {
      min-height: 38px;
      border-radius: 8px;
      color: var(--muted);
      padding: 0 12px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      white-space: nowrap;
    }

    .nav-submenu .nav-link {
      min-height: 34px;
      font-size: 14px;
    }

    .nav-link:hover,
    .nav-link.active {
      background: var(--accent-pale);
      color: var(--accent-dark);
      font-weight: 700;
    }

    button.primary {
      border-color: var(--accent-dark);
      background: var(--accent-dark);
      color: #ffffff;
    }

    button.primary:not(:disabled):hover {
      border-color: #006b59;
      background: #006b59;
    }

    button.danger {
      border-color: #f4b7b7;
      color: var(--bad);
    }

    button:disabled {
      cursor: progress;
      opacity: 0.7;
    }

    .session-chip {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.24);
      color: #eff6ff;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 700;
    }

    .content {
      padding: 18px 0 32px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .panel-head {
      min-height: 54px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-title {
      font-weight: 700;
    }

    form {
      padding: 14px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 11px;
      color: var(--text);
      font: inherit;
      background: #ffffff;
    }

    input:focus,
    select:focus {
      outline: 2px solid #9de7d3;
      border-color: var(--accent);
    }

    .group-options {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: #ffffff;
    }

    .group-option {
      min-height: 30px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 9px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      background: var(--accent-pale);
      margin: 0;
    }

    .group-option input {
      width: auto;
      min-height: auto;
      margin: 0;
    }

    .form-actions {
      margin-top: 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .table-wrap {
      width: 100%;
      overflow: auto;
    }

    table {
      width: max-content;
      border-collapse: collapse;
      min-width: 960px;
    }

    th,
    td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
    }

    th {
      color: var(--muted);
      background: var(--panel-soft);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    tbody tr:hover {
      background: var(--accent-pale);
    }

    .row-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 0 9px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .badge.good {
      background: var(--soft-good);
      border-color: #bfe8d4;
      color: var(--good);
    }

    .badge.warn {
      background: var(--soft-warn);
      border-color: #f3d088;
      color: var(--warn);
    }

    .badge.blue {
      background: var(--accent-pale);
      border-color: #b9e8dc;
      color: var(--accent-dark);
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .error-text {
      color: var(--bad);
      font-size: 13px;
      line-height: 1.35;
    }

    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      max-width: min(420px, calc(100% - 32px));
      background: #172722;
      color: #ffffff;
      border-radius: 8px;
      padding: 12px 14px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
    }

    .toast.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 860px) {
      .app-shell {
        display: block;
      }

      .app-header-inner {
        align-items: stretch;
        flex-direction: column;
        padding: 14px 0;
      }

      .sidebar {
        min-height: 0;
        position: static;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .actions {
        justify-content: flex-start;
      }

      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="app-header-inner">
        <div>
          <h1 id="appTitle">Administracion</h1>
          <div class="subtitle" id="summary">Cargando...</div>
        </div>
        <div class="actions">
          <span id="sessionBadge" class="session-chip">Sesion</span>
          <button id="logoutBtn" type="button" title="Cerrar sesion">
            <span aria-hidden="true">&#9211;</span>
            Salir
          </button>
        </div>
      </div>
    </header>
    <aside class="sidebar">
      <nav id="primaryNav" class="primary-nav" aria-label="Navegacion principal"></nav>
    </aside>

    <main class="content">
    <section class="layout" aria-label="Gestion de usuarios">
      <section class="panel">
        <div class="panel-head">
          <div class="panel-title" id="formTitle">Nuevo usuario</div>
          <button id="newBtn" type="button" title="Nuevo usuario">
            <span aria-hidden="true">&#43;</span>
            Nuevo
          </button>
        </div>
        <form id="userForm">
          <input id="userId" type="hidden">

          <label for="username">Usuario</label>
          <input id="username" autocomplete="off" required>

          <label for="name">Nombre</label>
          <input id="name" autocomplete="off" required>

          <label for="role">Rol</label>
          <select id="role" required></select>

          <label>Grupos</label>
          <div id="groupsBox" class="group-options"></div>

          <label>WhatsApp</label>
          <div id="whatsappAccountsBox" class="group-options"></div>

          <label for="password">Contrasena</label>
          <input id="password" type="password" autocomplete="new-password" required>

          <div class="form-actions">
            <button id="saveBtn" class="primary" type="submit">
              <span aria-hidden="true">&#10003;</span>
              Guardar
            </button>
            <button id="cancelBtn" type="button" hidden>Cancelar</button>
          </div>
          <div id="formError" class="error-text"></div>
        </form>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div class="panel-title">Listado</div>
          <span class="badge blue" id="userCount">0</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Usuario</th>
                <th>Nombre</th>
                <th>Rol</th>
                <th>Grupos</th>
                <th>WhatsApp</th>
                <th>Actualizado</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="usersBody">
              <tr>
                <td colspan="7" class="muted">Cargando...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const state = {
      users: [],
      roles: [],
      groups: [],
      whatsappAccounts: [],
      auth: null
    };

    const els = {
      cancelBtn: document.getElementById('cancelBtn'),
      appTitle: document.getElementById('appTitle'),
      formError: document.getElementById('formError'),
      formTitle: document.getElementById('formTitle'),
      groupsBox: document.getElementById('groupsBox'),
      logoutBtn: document.getElementById('logoutBtn'),
      name: document.getElementById('name'),
      newBtn: document.getElementById('newBtn'),
      password: document.getElementById('password'),
      primaryNav: document.getElementById('primaryNav'),
      role: document.getElementById('role'),
      saveBtn: document.getElementById('saveBtn'),
      sessionBadge: document.getElementById('sessionBadge'),
      summary: document.getElementById('summary'),
      toast: document.getElementById('toast'),
      userCount: document.getElementById('userCount'),
      userForm: document.getElementById('userForm'),
      userId: document.getElementById('userId'),
      username: document.getElementById('username'),
      whatsappAccountsBox: document.getElementById('whatsappAccountsBox'),
      usersBody: document.getElementById('usersBody')
    };

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function roleLabel(role) {
      const labels = {
        admin: 'Admin',
        usuario: 'Usuario'
      };
      return labels[role] || role;
    }

    function roleTone(role) {
      if (role === 'admin') {
        return 'good';
      }

      return 'blue';
    }

    async function detectAppKind() {
      try {
        const response = await fetch('/api/message-queue/status', {
          cache: 'no-store'
        });

        return response.ok ? 'administracion' : 'coordinacion';
      } catch (error) {
        return 'coordinacion';
      }
    }

    function renderNavigation(appKind) {
      const isCoordination = appKind === 'coordinacion';
      document.body.classList.toggle('coordination-app', isCoordination);
      els.appTitle.textContent = isCoordination ? 'Coordinacion' : 'Administracion';

      els.primaryNav.innerHTML = [
        '<a class="nav-link" href="/dashboard"><span aria-hidden="true">&#9638;</span><span>Tickets</span></a>',
        '<a class="nav-link" href="/mensajes"><span aria-hidden="true">&#9993;</span><span>Conversaciones</span></a>',
        '<a class="nav-link" href="/cola"><span aria-hidden="true">&#9776;</span><span>Cola</span></a>',
        '<details class="nav-group"><summary class="nav-link"><span aria-hidden="true">&#128101;</span><span>Clientes</span></summary><div class="nav-submenu">' +
          '<a class="nav-link" href="/phantom/suspendidos">Suspendidos</a>' +
          '<a class="nav-link" href="/phantom/activos">Activos</a>' +
          '<a class="nav-link" href="/phantom/baja">Bajas</a>' +
        '</div></details>',
        '<a class="nav-link" href="/errores"><span aria-hidden="true">&#9888;</span><span>Errores de envio</span></a>',
        '<a class="nav-link" href="/whatsapp"><span aria-hidden="true">&#9742;</span><span>WhatsApp</span></a>',
        '<a class="nav-link active" href="/usuarios"><span aria-hidden="true">&#128100;</span><span>Usuarios</span></a>'
      ].join('');
    }

    function formatDateTime(value) {
      if (!value) {
        return '--';
      }

      const normalized = String(value).includes('T') ? value : String(value).replace(' ', 'T') + 'Z';
      const date = new Date(normalized);

      if (Number.isNaN(date.getTime())) {
        return String(value);
      }

      return date.toLocaleString('es-AR', {
        hour: '2-digit',
        minute: '2-digit',
        day: '2-digit',
        month: '2-digit'
      });
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add('visible');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => {
        els.toast.classList.remove('visible');
      }, 3000);
    }

    async function fetchJson(url, options) {
      const response = await fetch(url, options);
      const data = await response.json().catch(() => ({}));

      if (response.status === 401) {
        window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname + window.location.search);
        return null;
      }

      if (response.status === 403) {
        window.location.href = '/dashboard';
        return null;
      }

      if (!response.ok || data.success === false) {
        throw new Error(data.error || 'Error HTTP ' + response.status);
      }

      return data;
    }

    async function loadSession() {
      const data = await fetchJson('/auth/me');

      if (!data) {
        return null;
      }

      if (data.user.role !== 'admin') {
        window.location.href = '/dashboard';
        return null;
      }

      state.auth = data.user;
      els.sessionBadge.textContent = data.user.name + ' | ADMIN';
      return data.user;
    }

    async function logout() {
      await fetch('/auth/logout', { method: 'POST' }).catch(() => {});
      window.location.href = '/login';
    }

    function renderRoleOptions() {
      els.role.innerHTML = state.roles.map(role => {
        return '<option value="' + escapeHtml(role) + '">' + escapeHtml(roleLabel(role)) + '</option>';
      }).join('');
    }

    function renderGroupOptions(selectedGroups = []) {
      const selected = new Set((selectedGroups || []).map(group => String(group).toLowerCase()));

      if (!state.groups.length) {
        els.groupsBox.innerHTML = '<span class="muted">Sin grupos detectados.</span>';
        return;
      }

      els.groupsBox.innerHTML = state.groups.map(group => {
        const id = 'group-' + group.toLowerCase().replace(/[^a-z0-9_-]+/g, '-');
        const checked = selected.has(String(group).toLowerCase()) ? ' checked' : '';

        return '<label class="group-option" for="' + escapeHtml(id) + '">' +
          '<input id="' + escapeHtml(id) + '" type="checkbox" value="' + escapeHtml(group) + '"' + checked + '>' +
          '<span>' + escapeHtml(group) + '</span>' +
        '</label>';
      }).join('');
    }

    function getSelectedGroups() {
      return Array.from(els.groupsBox.querySelectorAll('input[type="checkbox"]:checked'))
        .map(input => input.value);
    }

    function renderWhatsAppAccountOptions(selectedAccounts = []) {
      const accounts = state.whatsappAccounts.length
        ? state.whatsappAccounts
        : [{ id: 'bot-1', label: 'Numero 1' }, { id: 'bot-2', label: 'Numero 2' }];
      const selected = new Set((selectedAccounts && selectedAccounts.length ? selectedAccounts : ['bot-1'])
        .map(accountId => String(accountId).trim())
        .filter(Boolean));

      els.whatsappAccountsBox.innerHTML = accounts.map(account => {
        const id = 'whatsapp-' + String(account.id || '').replace(/[^a-z0-9_-]+/gi, '-');
        const checked = selected.has(String(account.id)) ? ' checked' : '';
        const phone = String(account.phone || '').trim();
        const label = String(account.label || account.id || '').trim();
        const text = phone ? `${label} (${phone})` : label;

        return '<label class="group-option" for="' + escapeHtml(id) + '">' +
          '<input id="' + escapeHtml(id) + '" type="checkbox" value="' + escapeHtml(account.id) + '"' + checked + '>' +
          '<span>' + escapeHtml(text) + '</span>' +
        '</label>';
      }).join('');
    }

    function getSelectedWhatsAppAccounts() {
      const selected = Array.from(els.whatsappAccountsBox.querySelectorAll('input[type="checkbox"]:checked'))
        .map(input => input.value);

      return selected.length ? selected : ['bot-1'];
    }

    function renderGroupBadges(groups = []) {
      if (!groups.length) {
        return '<span class="muted">--</span>';
      }

      return groups.map(group => {
        return '<span class="badge blue">' + escapeHtml(group) + '</span>';
      }).join(' ');
    }

    function renderWhatsAppAccountBadges(accounts = []) {
      const selected = Array.isArray(accounts) && accounts.length ? accounts : ['bot-1'];

      return selected.map(accountId => {
        const account = state.whatsappAccounts.find(item => item.id === accountId);
        const label = account && account.label || accountId;
        const phone = account && account.phone ? ` (${account.phone})` : '';
        return '<span class="badge blue">' + escapeHtml(label + phone) + '</span>';
      }).join(' ');
    }

    function renderUsers() {
      els.userCount.textContent = String(state.users.length);
      els.summary.textContent = state.users.length === 1
        ? '1 usuario'
        : state.users.length + ' usuarios';

      if (!state.users.length) {
        els.usersBody.innerHTML = '<tr><td colspan="7" class="muted">Sin usuarios.</td></tr>';
        return;
      }

      els.usersBody.innerHTML = state.users.map(user => {
        return '<tr>' +
          '<td><strong>' + escapeHtml(user.username) + '</strong></td>' +
          '<td>' + escapeHtml(user.name) + '</td>' +
          '<td><span class="badge ' + roleTone(user.role) + '">' + escapeHtml(roleLabel(user.role)) + '</span></td>' +
          '<td>' + (user.role === 'admin' ? '<span class="badge good">Todos</span>' : renderGroupBadges(user.groups || [])) + '</td>' +
          '<td>' + renderWhatsAppAccountBadges(user.whatsappAccounts || [user.whatsappAccount || 'bot-1']) + '</td>' +
          '<td class="muted">' + escapeHtml(formatDateTime(user.updatedAt)) + '</td>' +
          '<td>' +
            '<div class="row-actions">' +
              '<button type="button" data-action="edit" data-id="' + user.id + '">Editar</button>' +
              '<button class="danger" type="button" data-action="delete" data-id="' + user.id + '">Eliminar</button>' +
            '</div>' +
          '</td>' +
        '</tr>';
      }).join('');

      els.usersBody.querySelectorAll('button[data-action]').forEach(button => {
        button.addEventListener('click', () => {
          const user = state.users.find(item => String(item.id) === button.dataset.id);

          if (!user) {
            return;
          }

          if (button.dataset.action === 'edit') {
            editUser(user);
          } else {
            deleteUser(user);
          }
        });
      });
    }

    async function loadUsers() {
      const data = await fetchJson('/users');

      if (!data) {
        return;
      }

      state.roles = data.roles || [];
      state.groups = data.groups || [];
      state.whatsappAccounts = data.whatsappAccounts || [];
      state.users = data.users || [];
      renderRoleOptions();
      renderWhatsAppAccountOptions(['bot-1']);
      renderUsers();
    }

    function setSaving(saving) {
      els.saveBtn.disabled = saving;
      els.newBtn.disabled = saving;
      els.cancelBtn.disabled = saving;
    }

    function resetForm() {
      els.userId.value = '';
      els.username.value = '';
      els.name.value = '';
      els.role.value = 'usuario';
      renderGroupOptions([]);
      renderWhatsAppAccountOptions(['bot-1']);
      els.password.value = '';
      els.password.required = true;
      els.password.placeholder = '';
      els.formTitle.textContent = 'Nuevo usuario';
      els.cancelBtn.hidden = true;
      els.formError.textContent = '';
      els.username.focus();
    }

    function editUser(user) {
      els.userId.value = user.id;
      els.username.value = user.username;
      els.name.value = user.name;
      els.role.value = user.role;
      renderGroupOptions(user.groups || []);
      renderWhatsAppAccountOptions(user.whatsappAccounts || [user.whatsappAccount || 'bot-1']);
      els.password.value = '';
      els.password.required = false;
      els.password.placeholder = 'Opcional al editar';
      els.formTitle.textContent = 'Editar usuario';
      els.cancelBtn.hidden = false;
      els.formError.textContent = '';
      els.username.focus();
    }

    async function saveUser(event) {
      event.preventDefault();
      setSaving(true);
      els.formError.textContent = '';

      const id = els.userId.value;
      const body = {
        username: els.username.value.trim(),
        name: els.name.value.trim(),
        role: els.role.value,
        groups: getSelectedGroups(),
        whatsappAccounts: getSelectedWhatsAppAccounts(),
        password: els.password.value
      };

      if (id && !body.password) {
        delete body.password;
      }

      try {
        await fetchJson(id ? '/users/' + encodeURIComponent(id) : '/users', {
          method: id ? 'PUT' : 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(body)
        });
        resetForm();
        await loadUsers();
        showToast('Usuario guardado');
      } catch (error) {
        els.formError.textContent = error.message;
      } finally {
        setSaving(false);
      }
    }

    async function deleteUser(user) {
      const confirmed = window.confirm('Eliminar usuario ' + user.username + '?');

      if (!confirmed) {
        return;
      }

      try {
        await fetchJson('/users/' + encodeURIComponent(user.id), {
          method: 'DELETE'
        });
        await loadUsers();
        showToast('Usuario eliminado');
      } catch (error) {
        showToast(error.message);
      }
    }

    els.logoutBtn.addEventListener('click', logout);
    els.newBtn.addEventListener('click', resetForm);
    els.cancelBtn.addEventListener('click', resetForm);
    els.userForm.addEventListener('submit', saveUser);

    async function init() {
      renderNavigation(await detectAppKind());
      const user = await loadSession();

      if (!user) {
        return;
      }

      await loadUsers();
      resetForm();
    }

    init();
  </script>
</body>
</html>
