<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Enviar WhatsApp</title>
    <style>
        :root {
            --bg: #f6f7f9;
            --panel: #ffffff;
            --line: #d9dee7;
            --text: #17202a;
            --muted: #657386;
            --accent: #128c7e;
            --accent-dark: #075e54;
            --soft: #edf8f5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background:
                linear-gradient(180deg, rgba(18, 140, 126, 0.09), transparent 260px),
                var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
            padding: 24px;
        }

        .card {
            width: min(520px, 100%);
            background: var(--panel);
            padding: 26px;
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 18px 45px rgba(23, 32, 42, 0.12);
        }

        h2 {
            margin: 0 0 18px;
            font-size: 24px;
            letter-spacing: 0;
        }

        .session-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 18px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        label {
            display: block;
            margin-top: 15px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        input, textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px 12px;
            margin-top: 6px;
            color: var(--text);
            font: inherit;
            line-height: 1.35;
        }

        input:focus, textarea:focus {
            outline: 2px solid #bfe8d4;
            border-color: var(--accent);
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        button {
            min-height: 40px;
            margin-top: 20px;
            border: 1px solid var(--accent);
            border-radius: 8px;
            background: var(--accent);
            color: white;
            padding: 0 12px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: var(--accent-dark);
            border-color: var(--accent-dark);
        }

        .logout {
            width: auto;
            min-width: 82px;
            margin-top: 0;
            background: white;
            color: var(--text);
            border: 1px solid var(--line);
        }

        .logout:hover {
            background: var(--soft);
            border-color: #bfe8d4;
        }

        .result {
            min-height: 40px;
            margin-top: 15px;
            padding: 10px 12px;
            background: var(--soft);
            border: 1px solid #bfe8d4;
            border-radius: 8px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.35;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="session-row">
        <span id="sessionBadge">Sesion</span>
        <button id="logoutBtn" class="logout" type="button">Salir</button>
    </div>

    <h2>Enviar WhatsApp</h2>

    <form id="formWhatsapp">
        <label>Telefono</label>
        <input
            type="text"
            id="phone"
            placeholder="Ej: 5491123456789"
            required
        >

        <label>Mensaje</label>
        <textarea id="message" required>Hola, le informamos que nuestro tecnico esta proximo a llegar a su domicilio.</textarea>

        <button type="submit">Enviar mensaje</button>
    </form>

    <div id="result" class="result"></div>
</div>

<script>
async function loadSession() {
    const response = await fetch('/auth/me');
    const data = await response.json().catch(() => ({}));

    if (!response.ok || !data.success) {
        window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname + window.location.search);
        return;
    }

    document.getElementById('sessionBadge').textContent = data.user.name + ' | ' + data.user.role.toUpperCase();
}

document.getElementById('logoutBtn').addEventListener('click', async function() {
    await fetch('/auth/logout', { method: 'POST' }).catch(() => {});
    window.location.href = '/login';
});

document.getElementById('formWhatsapp').addEventListener('submit', async function(e) {
    e.preventDefault();

    const phone = document.getElementById('phone').value.trim();
    const message = document.getElementById('message').value.trim();
    const result = document.getElementById('result');

    result.innerHTML = 'Enviando...';

    try {
        const response = await fetch('/send', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                phone: phone,
                message: message
            })
        });
        const data = await response.json().catch(() => ({}));

        if (response.status === 401) {
            window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname + window.location.search);
            return;
        }

        if (data.success) {
            result.innerHTML = 'Mensaje enviado correctamente';
        } else {
            result.innerHTML = 'Error: ' + (data.error || 'No se pudo enviar');
        }
    } catch (error) {
        result.innerHTML = 'Error de conexion con la API: ' + error.message;
    }
});

loadSession();
</script>

</body>
</html>
