<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sesiones WhatsApp</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #d9dee7;
      --text: #17202a;
      --muted: #657386;
      --accent: #2563eb;
      --accent-soft: #eaf1ff;
      --good: #11845b;
      --bad: #bd2c2c;
      --soft-good: #e7f7ef;
      --soft-bad: #fde8e8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, rgba(37, 99, 235, 0.08), transparent 230px), var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      grid-template-rows: auto 1fr;
    }

    .app-header {
      grid-column: 1 / -1;
      border-bottom: 1px solid #1d4ed8;
      background: var(--accent);
      color: #ffffff;
    }

    .app-header-inner,
    .content {
      width: min(1680px, calc(100% - 32px));
      margin: 0 auto;
    }

    .app-header-inner {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .app-sidebar {
      min-height: calc(100vh - 69px);
      position: sticky;
      top: 0;
      border-right: 1px solid var(--line);
      background: #f8fbff;
      padding: 16px 12px;
      align-self: start;
    }

    .primary-nav {
      display: grid;
      gap: 8px;
    }

    .nav-group {
      display: grid;
      gap: 4px;
    }

    .nav-group summary {
      list-style: none;
    }

    .nav-group summary::-webkit-details-marker {
      display: none;
    }

    .nav-group .nav-link {
      width: 100%;
    }

    .nav-submenu {
      display: grid;
      gap: 4px;
      padding-left: 16px;
    }

    .nav-submenu .nav-link {
      min-height: 34px;
      font-size: 14px;
    }

    .nav-link {
      min-height: 38px;
      border-radius: 8px;
      color: var(--muted);
      padding: 0 12px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .nav-link:hover,
    .nav-link.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 4px;
      color: #dbeafe;
      font-size: 13px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      background: #ffffff;
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    button.danger {
      border-color: #f3b4b4;
      background: var(--soft-bad);
      color: var(--bad);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.62;
    }

    .session-chip {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      border: 1px solid rgba(255, 255, 255, 0.38);
      border-radius: 999px;
      padding: 0 12px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
    }

    .content {
      padding: 18px 0 28px;
    }

    .session-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }

    .card-head {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .card-title {
      font-weight: 800;
      font-size: 17px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 0 9px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .badge.good {
      background: var(--soft-good);
      color: var(--good);
    }

    .badge.bad {
      background: var(--soft-bad);
      color: var(--bad);
    }

    .card-body {
      padding: 14px;
      display: grid;
      gap: 14px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .field {
      border-bottom: 1px solid var(--line);
      padding-bottom: 9px;
      min-width: 0;
    }

    .field-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .field-value {
      margin-top: 4px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .label-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: end;
    }

    .label-form label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .label-form input {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      font: inherit;
      background: #ffffff;
      text-transform: none;
    }

    .qr-box {
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #f8fafc;
    }

    .qr-box[hidden] {
      display: none;
    }

    .qr-box img {
      width: 180px;
      height: 180px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #ffffff;
    }

    .qr-title {
      font-weight: 800;
    }

    .qr-detail,
    .muted {
      color: var(--muted);
      line-height: 1.4;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      background: #17202a;
      color: #ffffff;
      padding: 12px 14px;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 10;
    }

    .toast.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 980px) {
      .app-shell {
        display: block;
      }

      .app-sidebar {
        min-height: auto;
        position: static;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .primary-nav {
        grid-template-columns: repeat(4, max-content);
        overflow-x: auto;
      }

      .session-grid,
      .field-grid,
      .qr-box {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="app-header-inner">
        <div>
          <h1>Sesiones WhatsApp</h1>
          <div class="subtitle" id="lastRefresh">Cargando...</div>
        </div>
        <div class="actions">
          <span id="sessionBadge" class="session-chip">Sesion</span>
          <button id="logoutBtn" type="button" title="Cerrar sesion">
            <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
            Salir
          </button>
        </div>
      </div>
    </header>

    <aside class="app-sidebar">
      <nav class="primary-nav" aria-label="Navegacion principal">
        <a class="nav-link" href="/dashboard">
          <span aria-hidden="true">&#9638;</span>
          Tickets
        </a>
        <a class="nav-link" href="/mensajes">
          <span aria-hidden="true">&#9993;</span>
          Mensajes
        </a>
        <a class="nav-link" href="/cola">
          <span aria-hidden="true">&#9776;</span>
          Cola
        </a>
        <details class="nav-group">
          <summary class="nav-link">
            <span aria-hidden="true">&#128101;</span>
            Clientes
          </summary>
          <div class="nav-submenu">
            <a class="nav-link" href="/phantom/suspendidos">Suspendidos</a>
            <a class="nav-link" href="/phantom/activos">Activos</a>
            <a class="nav-link" href="/phantom/baja">Bajas</a>
          </div>
        </details>
        <a class="nav-link" href="/errores">
          <span aria-hidden="true">&#9888;</span>
          Errores de envio
        </a>
        <a class="nav-link active" href="/whatsapp">
          <span aria-hidden="true">&#9742;</span>
          WhatsApp
        </a>
        <a class="nav-link" href="/usuarios">
          <span aria-hidden="true">&#128100;</span>
          Usuarios
        </a>
      </nav>
    </aside>

    <main class="content">
      <section id="sessionGrid" class="session-grid" aria-label="Sesiones WhatsApp">
        <div class="muted">Cargando sesiones...</div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const state = {
      accounts: [],
      loading: false
    };

    const els = {
      lastRefresh: document.getElementById('lastRefresh'),
      logoutBtn: document.getElementById('logoutBtn'),
      sessionBadge: document.getElementById('sessionBadge'),
      sessionGrid: document.getElementById('sessionGrid'),
      toast: document.getElementById('toast')
    };

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatDateTime(value) {
      if (!value) {
        return '--';
      }

      const date = new Date(Number(value) || value);

      if (Number.isNaN(date.getTime())) {
        return '--';
      }

      return new Intl.DateTimeFormat('es-AR', {
        day: '2-digit',
        month: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      }).format(date);
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add('visible');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => {
        els.toast.classList.remove('visible');
      }, 3200);
    }

    async function fetchJson(url, options) {
      const response = await fetch(url, options);
      const data = await response.json().catch(() => ({}));

      if (response.status === 401 || response.status === 403) {
        window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname + window.location.search);
        return null;
      }

      if (!response.ok || !data.success) {
        throw new Error(data.error || `HTTP ${response.status}`);
      }

      return data;
    }

    async function loadSession() {
      const data = await fetchJson('/auth/me');

      if (!data) {
        return null;
      }

      if (data.user.role !== 'admin') {
        window.location.href = '/mensajes';
        return null;
      }

      els.sessionBadge.textContent = data.user.name + ' | ADMIN';
      return data.user;
    }

    async function logout() {
      await fetch('/auth/logout', { method: 'POST' }).catch(() => { });
      window.location.href = '/login';
    }

    function getAccountPhone(account) {
      const phone = String(account && account.phone || '').trim();
      const name = String(account && account.displayName || '').trim();

      if (!phone) {
        return '--';
      }

      return name ? `${phone} (${name})` : phone;
    }

    function renderAccounts() {
      if (!state.accounts.length) {
        els.sessionGrid.innerHTML = '<div class="muted">Sin sesiones configuradas.</div>';
        return;
      }

      els.sessionGrid.innerHTML = state.accounts.map(account => {
        const ready = Boolean(account.ready);
        const badgeClass = ready ? 'good' : 'bad';
        const badgeText = ready ? 'Conectado' : 'No conectado';
        const qr = !ready && account.qrSvg ? `
          <div class="qr-box">
            <img src="${escapeHtml(account.qrSvg)}" alt="QR ${escapeHtml(account.label || account.id)}">
            <div>
              <div class="qr-title">Vincular ${escapeHtml(account.label || account.id)}</div>
              <div class="qr-detail">Escanea este codigo desde WhatsApp para conectar esta sesion.</div>
            </div>
          </div>
        ` : '';

        return `
          <article class="card" data-account-id="${escapeHtml(account.id)}">
            <div class="card-head">
              <div>
                <div class="card-title">${escapeHtml(account.label || account.id)}</div>
                <div class="muted">${escapeHtml(account.clientId || account.id || '--')}</div>
              </div>
              <span class="badge ${badgeClass}">${badgeText}</span>
            </div>
            <div class="card-body">
              <form class="label-form" data-action="rename" data-account-id="${escapeHtml(account.id)}">
                <label>
                  Nombre visible
                  <input name="label" value="${escapeHtml(account.label || account.id)}" maxlength="40" autocomplete="off">
                </label>
                <button class="primary" type="submit">
                  <i class="bi bi-check2" aria-hidden="true"></i>
                  Guardar
                </button>
              </form>
              <div class="field-grid">
                <div class="field">
                  <div class="field-label">Numero</div>
                  <div class="field-value">${escapeHtml(getAccountPhone(account))}</div>
                </div>
                <div class="field">
                  <div class="field-label">Estado</div>
                  <div class="field-value">${escapeHtml(account.state || '--')}</div>
                </div>
                <div class="field">
                  <div class="field-label">Ultimo evento</div>
                  <div class="field-value">${escapeHtml(formatDateTime(account.lastEventAt))}</div>
                </div>
                <div class="field">
                  <div class="field-label">WID</div>
                  <div class="field-value">${escapeHtml(account.wid || '--')}</div>
                </div>
              </div>
              ${account.lastError ? `<div class="field"><div class="field-label">Error</div><div class="field-value">${escapeHtml(account.lastError)}</div></div>` : ''}
              ${qr}
              <div class="card-actions">
                <button class="primary" type="button" data-action="reconnect" data-account-id="${escapeHtml(account.id)}">
                  <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
                  Reconectar
                </button>
                <button class="danger" type="button" data-action="reset-auth" data-account-id="${escapeHtml(account.id)}">
                  <i class="bi bi-trash3" aria-hidden="true"></i>
                  Borrar sesion
                </button>
              </div>
            </div>
          </article>
        `;
      }).join('');

      els.sessionGrid.querySelectorAll('button[data-action]').forEach(button => {
        button.addEventListener('click', () => {
          runAccountAction(button.dataset.action, button.dataset.accountId).catch(error => {
            showToast(error.message);
          });
        });
      });

      els.sessionGrid.querySelectorAll('form[data-action="rename"]').forEach(form => {
        form.addEventListener('submit', event => {
          event.preventDefault();
          renameAccount(form.dataset.accountId, form.elements.label.value).catch(error => {
            showToast(error.message);
          });
        });
      });
    }

    async function loadStatus() {
      const data = await fetchJson('/tickets/job-status');
      state.accounts = data.whatsappAccounts || (data.whatsapp ? [data.whatsapp] : []);
      renderAccounts();
      els.lastRefresh.textContent = `Actualizado ${new Intl.DateTimeFormat('es-AR', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      }).format(new Date())}`;
    }

    async function runAccountAction(action, accountId) {
      if (state.loading) {
        return;
      }

      if (action === 'reset-auth' && !window.confirm('Esto borra la sesion local y genera un QR nuevo. Continuar?')) {
        return;
      }

      state.loading = true;
      els.sessionGrid.querySelectorAll('button').forEach(button => {
        button.disabled = true;
      });

      try {
        const url = action === 'reset-auth' ? '/whatsapp/reset-auth' : '/whatsapp/reconnect';
        await fetchJson(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ accountId })
        });
        showToast(action === 'reset-auth' ? 'Sesion borrada' : 'Sesion reiniciada');
        await loadStatus();
      } finally {
        state.loading = false;
        els.sessionGrid.querySelectorAll('button').forEach(button => {
          button.disabled = false;
        });
      }
    }

    async function renameAccount(accountId, label) {
      const cleanLabel = String(label || '').trim();

      if (!cleanLabel) {
        showToast('El nombre no puede estar vacio');
        return;
      }

      state.loading = true;
      els.sessionGrid.querySelectorAll('button, input').forEach(control => {
        control.disabled = true;
      });

      try {
        await fetchJson('/whatsapp/accounts/' + encodeURIComponent(accountId), {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ label: cleanLabel })
        });
        showToast('Nombre actualizado');
        await loadStatus();
      } finally {
        state.loading = false;
        els.sessionGrid.querySelectorAll('button, input').forEach(control => {
          control.disabled = false;
        });
      }
    }

    els.logoutBtn.addEventListener('click', logout);

    async function init() {
      const user = await loadSession();

      if (!user) {
        return;
      }

      await loadStatus();
      setInterval(() => {
        loadStatus().catch(error => {
          els.lastRefresh.textContent = `Error: ${error.message}`;
        });
      }, 15000);
    }

    init().catch(error => {
      els.lastRefresh.textContent = `Error: ${error.message}`;
    });
  </script>
</body>

</html>
